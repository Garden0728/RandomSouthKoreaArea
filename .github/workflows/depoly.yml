name: Build & Push Docker Image

on:
  push:
    branches:
      - master
jobs:
  Deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout #체크 아웃  ##코드를 Actions에 코드를 가져온다.
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Docker login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{secrets.DOCKER_USERNAME }}" --password-stdin
      - name: Build Docker image
        run: |
          docker build -t choijungwon/random-area:latest .


      - name: Push Docker image
        run: |
          docker push choijungwon/random-area:latest
      - name: SSH(원격 접속)로 EC2에 접속하기
        uses: appleboy/ssh-action@v1.0.3
        env:
          SPRING_PROFILES_ACTIVE: prod
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_JAVASCRIPT_KEY: ${{ secrets.KAKAO_JAVASCRIPT_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          envs: SPRING_PROFILES_ACTIVE,KAKAO_REST_API_KEY,KAKAO_JAVASCRIPT_KEY,SENTRY_DSN
          script_stop: true
          script: |
            cd ~/deploy
            docker compose pull
            sudo -E bash ./switchV2.sh

      
